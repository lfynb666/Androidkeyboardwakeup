plugins {
    id "com.android.application"
}

android {
    namespace "com.codex.wakeup"
    compileSdk 35

    defaultConfig {
        applicationId "com.codex.wakeup"
        minSdk 35
        // The controller is a separate Android 17-capable app. It does not
        // contain the Android 9 Bluetooth HID bridge.
        targetSdk 35
        versionCode 1
        versionName "0.1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

